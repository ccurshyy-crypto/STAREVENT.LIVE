    <script>
      (function () {
        var qs = window.location.search || '';
        var p = window.location.pathname || '';

          p.indexOf('/overlay/') === 0 ||
          p.indexOf('/scoreboard/') === 0

                : 'overlay-transparent';
          document.documentElement.classList.add(cls);
